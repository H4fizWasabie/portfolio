<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Content Lab — concept prototypes</title>
<style>
:root{--ink:#18212a;--muted:#64717c;--line:#d8e0e4;--paper:#f7faf9;--orange:#ef743d;--teal:#087e79;--navy:#16344a;--cream:#f3ede2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 28px 110px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.top a{color:var(--muted);text-decoration:none}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800;color:var(--orange)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.9rem,7vw,6.8rem);line-height:.9;letter-spacing:-.075em;max-width:850px;margin:22px 0}.hero{padding:70px 0 48px}.hero p{max-width:700px;color:var(--muted);font-size:1.1rem}.honest{display:inline-flex;gap:8px;align-items:center;border:1px solid #e9b39c;border-radius:999px;color:#a84f2b;padding:6px 11px;font-size:.77rem;font-weight:700}.hero-grid{display:grid;grid-template-columns:1fr .8fr;gap:24px;align-items:end}.signal{background:var(--navy);color:white;border-radius:24px;padding:26px;min-height:210px;position:relative;overflow:hidden}.signal:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff35;border-radius:50%;right:-90px;bottom:-100px}.signal strong{font-size:3.2rem;line-height:1;display:block;color:#ffd18b}.signal span{display:block;color:#cbd9df;margin-top:8px}.section{padding:60px 0;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:24px;align-items:baseline;margin-bottom:22px}.section h2{font-size:2rem;letter-spacing:-.04em}.section-head p{color:var(--muted);max-width:470px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.card h3{font-size:1rem;margin-bottom:8px}.card p{color:var(--muted);margin-bottom:0}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{min-height:150px;padding:18px;background:#eaf1f1;border-top:3px solid var(--teal);border-radius:12px}.step em{font-style:normal;color:var(--teal);font-weight:800;font-size:.75rem}.step h3{margin:28px 0 4px;font-size:1rem}.step p{font-size:.82rem;color:var(--muted);margin:0}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.products figure{margin:0;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.products img{width:100%;height:210px;display:block;object-fit:contain;background:#fff}.products figcaption{padding:11px;font-size:.78rem;color:var(--muted)}.campaign{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.mock{background:var(--cream);border-radius:20px;overflow:hidden;min-height:360px;color:#31291f}.mockbar{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #d8cdbd;font-size:.75rem}.mockbody{padding:42px 36px}.mockbody small{color:#a26a3e;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.mockbody h3{font:700 clamp(2rem,4vw,4.5rem)/.94 Georgia,serif;letter-spacing:-.06em;margin:12px 0}.mockbody p{color:#766a5c;max-width:520px}.mockbutton{display:inline-block;background:#31705d;color:white;border-radius:8px;padding:11px 14px;font-weight:800}.board{background:#102c3d;color:#f6fbfa;border-radius:20px;padding:22px}.board h3{font-size:1.3rem}.meter{height:8px;border-radius:99px;background:#355263;overflow:hidden;margin:22px 0}.meter i{display:block;width:68%;height:100%;background:#ff9c60}.board-row{display:flex;justify-content:space-between;border-top:1px solid #ffffff24;padding:13px 0;font-size:.88rem}.board-row span:last-child{color:#ffcf83}.content-set{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.hook{font-size:1.65rem;line-height:1.1;margin:10px 0 24px}.hook-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.hook-card small{color:var(--orange);text-transform:uppercase;font-weight:800;letter-spacing:.1em}.review{background:#f0f5f3;border-radius:18px;padding:22px}.review li{margin:10px 0;color:var(--muted)}.workflow{display:flex;align-items:center;gap:0}.wf{flex:1;text-align:center;padding:18px 8px;background:white;border:1px solid var(--line);position:relative}.wf:not(:last-child):after{content:"→";position:absolute;right:-13px;top:25px;background:var(--paper);color:var(--orange);z-index:2;padding:0 3px;font-weight:800}.wf b{display:block;font-size:.8rem}.wf span{display:block;color:var(--muted);font-size:.72rem;margin-top:6px}.closing{background:#fff4e7;border:1px solid #f2cfaa;border-radius:18px;padding:25px;max-width:760px}.closing p{margin:0;color:#765638}.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);border:1px solid #111;display:flex;gap:5px;align-items:center;background:#111111f2;color:white;padding:6px;border-radius:0;z-index:10}.switcher a{color:#bad2d5;text-decoration:none;font-size:.75rem;font-weight:800;padding:9px 13px;border-radius:0}.switcher a.active{background:#E4002B;color:#fff}.switcher small{padding:0 9px;color:#b4c6ca}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.variant>*{animation:rise .6s both}.variant>*:nth-child(2){animation-delay:.06s}.variant>*:nth-child(3){animation-delay:.12s}.variant>*:nth-child(4){animation-delay:.18s}
/* Variant 2: editorial case study */
.editorial{--paper:#f5f0e8;--ink:#27231f;--muted:#766c63;--line:#cfc4b8;--orange:#b2522e}.editorial .hero{max-width:940px}.editorial h1{font:500 clamp(3rem,8vw,8rem)/.84 Georgia,serif;letter-spacing:-.08em}.editorial .hero-grid{grid-template-columns:1.3fr .7fr}.editorial .signal{background:#dce3dc;color:#27231f;border-radius:0}.editorial .signal strong{color:#b2522e}.editorial .section{padding:72px 0}.editorial .card,.editorial .hook-card{border-radius:0;background:transparent;border-color:#b9ada1}.editorial .step{border-radius:0;background:transparent;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}.editorial .mock{border-radius:0}.editorial .board{border-radius:0;background:#342f38}.editorial .workflow .wf{background:transparent;border-color:#b9ada1}
/* Variant 3: content studio */
.studio{--paper:#0d1720;--ink:#edf5f3;--muted:#9bb0b6;--line:#29404b;--orange:#ff9b62;--teal:#55d4bc}.studio .top{border-color:var(--line)}.studio .top a{color:var(--muted)}.studio .hero p,.studio .section-head p{color:var(--muted)}.studio .card,.studio .hook-card,.studio .wf{background:#142631;border-color:var(--line)}.studio .step{background:#152e39;border-color:var(--teal)}.studio .products figure{background:#142631;border-color:var(--line)}.studio .products img{background:#f8f7f3}.studio .products figcaption,.studio .card p,.studio .step p,.studio .review li{color:var(--muted)}.studio .review{background:#142631}.studio .mock{box-shadow:0 25px 70px #0008}.studio .section{border-color:var(--line)}.studio .closing{background:#182d2c;border-color:#2d6158}.studio .closing p{color:#bce6db}
@media(max-width:760px){.shell{padding:18px 16px 100px}.hero{padding:48px 0 35px}.hero-grid,.campaign,.content-set{grid-template-columns:1fr}.grid,.steps,.products{grid-template-columns:1fr 1fr}.steps .step:last-child{grid-column:span 2}.workflow{overflow:auto;padding-bottom:8px}.wf{min-width:125px}.switcher{width:max-content;max-width:calc(100vw - 22px)}.switcher small{display:none}.switcher a{padding:8px 9px;font-size:.68rem}.section{padding:42px 0}}
@media(max-width:430px){.grid,.products{grid-template-columns:1fr}.steps .step:last-child{grid-column:auto}.mockbody{padding:30px 22px}.products img{height:180px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<nav class="top"><a href="/portfolio/">← Back to portfolio</a><a href="resume.html">Resume →</a></nav>
<div id="app"></div>
</main>
<nav class="switcher" aria-label="Prototype variants"><small>DESIGN PROTOTYPE</small><a data-v="control" href="?v=control">Control room</a><a data-v="editorial" href="?v=editorial">Editorial</a><a data-v="studio" href="?v=studio">Content studio</a></nav>
<script>
const v=new URLSearchParams(location.search).get('v')||'control';
const images=['hills-sensitive-stomach.jpg','hills-range.jpg','hills-urinary-care.jpg','hills-featured-range.jpeg'];
const products=['Sensitive Stomach & Skin','Cat and dog range','c/d Urinary Care','Supplied promotional artwork'];
const productHTML=products.map((p,i)=>`<figure><img src="/portfolio/img/${images[i]}" alt="Hill’s product material"><figcaption>${p}</figcaption></figure>`).join('');
const common=`
<header class="hero"><div class="kicker">Theoses / AI Content Lab / concept prototype</div><div class="hero-grid"><div><h1>Make product education feel like a conversation.</h1><p>A self-directed campaign concept showing how research, AI-assisted drafting, review checkpoints, and content packaging can turn a pet-food product range into useful customer-facing communication.</p><span class="honest">Personal mock campaign · not client work</span></div><div class="signal"><strong>05</strong><span>stages from product facts to a publishable content idea</span></div></div></header>
<section class="section"><div class="section-head"><h2>01 / The brief</h2><p>Start with the customer question, then make the product story easier to understand.</p></div><div class="grid"><article class="card"><h3>Audience</h3><p>Pet owners comparing nutrition options and looking for a clearer starting point.</p></article><article class="card"><h3>Campaign target</h3><p>Build awareness through approachable product education and conversation-led content.</p></article><article class="card"><h3>Creative constraint</h3><p>Stay useful, readable, and careful with product claims. Invite questions instead of forcing a recommendation.</p></article></div></section>
<section class="section"><div class="section-head"><h2>02 / Research to strategy</h2><p>Each milestone has a checkpoint so the work stays grounded.</p></div><div class="steps"><article class="step"><em>01 · DISCOVER</em><h3>Research</h3><p>Product facts, owner concerns, competitor angles.</p></article><article class="step"><em>02 · DEFINE</em><h3>Position</h3><p>Choose one audience question and one message.</p></article><article class="step"><em>03 · CREATE</em><h3>Content</h3><p>Draft hooks, captions, visuals, and formats.</p></article><article class="step"><em>04 · CHECK</em><h3>Review</h3><p>Check clarity, tone, accuracy, and next action.</p></article><article class="step"><em>05 · LEARN</em><h3>Measure</h3><p>Track useful responses and refine the next idea.</p></article></div></section>
<section class="section"><div class="section-head"><h2>03 / Product material</h2><p>Real supplied product images used as visual material for a fictional campaign exercise.</p></div><div class="products">${productHTML}</div></section>
<section class="section"><div class="section-head"><h2>04 / Campaign concept</h2><p>One product range becomes a small family of educational content formats.</p></div><div class="campaign"><div class="mock"><div class="mockbar"><b>PAW / DAILY</b><span>RANGE SPOTLIGHT</span></div><div class="mockbody"><small>Hill’s Science Diet · education concept</small><h3>One range. Different needs. Start with the right question.</h3><p>Adult, small-breed, sensitive-stomach, and urinary-care options can begin different conversations with pet owners.</p><span class="mockbutton">Find your starting point →</span></div></div><div class="board"><h3>Campaign control room</h3><p style="color:#b8cbd0">Milestone 03 of 05 · content set in review</p><div class="meter"><i></i></div><div class="board-row"><span>Target</span><span>Pet-owner education</span></div><div class="board-row"><span>Checkpoint</span><span>Claims + tone check</span></div><div class="board-row"><span>Next action</span><span>Adapt to short video</span></div></div></div></section>
<section class="section"><div class="section-head"><h2>05 / Content set</h2><p>Different hooks let the same product story travel across formats.</p></div><div class="content-set"><article class="hook-card"><small>Social hook / conversation starter</small><p class="hook">“Adult, small breed, sensitive stomach — which clue describes your pet?”</p><p style="color:var(--muted)">Format: educational carousel or short-form video opener.</p></article><div class="review"><h3>Review checklist</h3><ul><li>Is the customer question clear?</li><li>Are product details presented carefully?</li><li>Does the post invite a useful response?</li><li>Can the idea be adapted into another format?</li></ul></div></div></section>
<section class="section"><div class="section-head"><h2>06 / The Theoses workflow</h2><p>A repeatable process for turning a blank page into reviewed content.</p></div><div class="workflow"><div class="wf"><b>Research</b><span>gather inputs</span></div><div class="wf"><b>Draft</b><span>shape angles</span></div><div class="wf"><b>Review</b><span>check quality</span></div><div class="wf"><b>Refine</b><span>adapt formats</span></div><div class="wf"><b>Learn</b><span>capture signals</span></div></div></section>
<section class="section"><div class="closing"><div class="kicker">What this demonstrates</div><p>Theoses helps me structure research, develop hooks, draft content, create visual directions, and keep review checkpoints visible. I select and edit the final direction myself. This is a portfolio demonstration of the process—not a claim of official Hill’s campaign work.</p></div></section>`;
document.body.className=v==='editorial'?'editorial':v==='studio'?'studio':'';document.getElementById('app').className='variant';document.getElementById('app').innerHTML=common;document.querySelector(`[data-v="${v}"]`)?.classList.add('active');
</script>
</body></html>
