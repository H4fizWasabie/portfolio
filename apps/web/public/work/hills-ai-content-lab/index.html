<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--paper:#f2f0eb;--ink:#0c0c0c;--blue:#2540e8;--acid:#e8ff3a;--pink:#ff5c8a;
  --sans:"Archivo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);line-height:1.5;
  background-image:linear-gradient(rgba(12,12,12,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(12,12,12,.10) 1px,transparent 1px);
  background-size:26px 26px}
main{max-width:1080px;margin:0 auto;padding:18px 18px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:3px solid var(--ink);background:#fff;padding:8px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
.badge{background:var(--ink);color:var(--acid);padding:3px 8px;font-weight:500}
.pill{border:3px solid var(--ink);padding:3px 8px;background:var(--acid);font-weight:500}
.topbar a{color:var(--ink);text-decoration:none;font-weight:500;border-bottom:3px solid var(--pink)}
.case-head{border:3px solid var(--ink);background:#fff;box-shadow:8px 8px 0 var(--ink);margin-top:26px;padding:26px 24px}
.case-head .no{font-size:11px;letter-spacing:.2em;color:var(--blue);text-transform:uppercase}
h1{font-family:var(--sans);font-weight:800;font-size:clamp(34px,7vw,64px);text-transform:uppercase;letter-spacing:-.03em;line-height:.95;margin:10px 0 14px}
.lede{font-size:14.5px;max-width:640px}
.lede b{background:var(--acid);padding:1px 6px;font-weight:500}
.plate{border:3px solid var(--ink);background:#fff;box-shadow:8px 8px 0 var(--ink);margin-top:26px}
.plate img{display:block;width:100%;height:auto;border-bottom:3px solid var(--ink)}
.fig-credit{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a8a8a;flex-wrap:wrap}
.fig-credit span:first-child{color:var(--ink);font-weight:500}
h2{font-family:var(--sans);font-weight:800;font-size:clamp(20px,3vw,28px);text-transform:uppercase;letter-spacing:-.02em;margin:44px 0 16px;display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;border-top:3px solid var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);background:#fff;padding:4px 9px;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.chip-blue{background:var(--blue);color:#fff}
.chip-pink{background:var(--pink)}
.links{display:flex;flex-wrap:wrap;gap:16px}
.links a{border:3px solid var(--ink);background:#fff;padding:12px 18px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:.13s}
.links a:hover{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);background:var(--pink)}
footer{margin-top:56px;border-top:3px solid var(--ink);padding-top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer a{color:var(--ink);border-bottom:3px solid var(--pink);text-decoration:none}
</style>
<body>
<main>
  <div class="topbar">
    <span class="badge">HJ — SYSTEMS BUILDER</span>
    <a href="/">&larr; INDEX</a>
    <span class="pill">CASE FILE</span>
  </div>

  <header class="case-head">
    <span class="no">CASE FILE · HILLS-AI-CONTENT-LAB</span>
    <h1>Hill&#x27;s AI Content Lab</h1>
    <p class="lede"><b>Practice project</b> A self-directed pet-food promotion concept built from supplied product material.</p>
  </header>
  <figure class="plate">
    <img src="/img/hills-featured-range.jpeg" alt="Hill&#x27;s AI Content Lab — screenshot">
    <figcaption class="fig-credit"><span>fig. 01 — hill&#x27;s — featured range (campaign material)</span><span>live capture, not a mock</span></figcaption>
  </figure>
  <h2>Tags</h2>
  <div class="tags"><span class="chip">hooks</span><span class="chip chip-blue">content strategy</span><span class="chip chip-pink">AI-assisted</span></div>
  <footer><span>case file · hills-ai-content-lab</span><span><a href="/">&larr; back to index</a></span></footer>
</main>
</body>
</html>
