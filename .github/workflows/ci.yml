name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The résumé PDF is printed at build time; same fonts as the VPS so the one-page check means the same thing.
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter fonts-ibm-plex poppler-utils
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm ci --prefix variants/redesign
      - run: node variants/redesign/publish-test.cjs
